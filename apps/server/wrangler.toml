name = "seeearth"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# The viewer is served from the same Worker; /api/* goes to the code first.
[assets]
directory = "../viewer/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "seeearth"
# Replace with the id printed by `npx wrangler d1 create seeearth` before deploying.
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "seeearth"

# Nightly full snapshot of the change log to R2.
[triggers]
crons = ["0 3 * * *"]

# Secrets (set with `npx wrangler secret put ADMIN_TOKEN`; locally in .dev.vars):
#   ADMIN_TOKEN: bearer token for /api/admin/* (reverts, bans)
